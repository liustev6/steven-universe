# Spike 04f (spikes/04-pi-mic): spike 04b with background under 50% of clips (75% in 04b), at -5 to +15 dB (-5 to
# +10), and the owner's videos back in the background pool at ~5% of picks (29% in spike 04): 97 clips, taken out of
# the video negatives so none is on both sides (spike 04's mistake).
run: xiao_pai_04f
word: 小派小派
wake_word: 小派小派
model_name: xiao_pai_04f
languages: [zh]
piper_samples: 0
own_voice_copies: 5
own_voice_negative_copies: 5
probability_cutoff: 0.97

augmentation:
  probabilities: {SevenBandParametricEQ: 0.1, TanhDistortion: 0.1, PitchShift: 0.1, BandStopFilter: 0.1,
                  AddColorNoise: 0.1, AddBackgroundNoise: 0.5, Gain: 1.0, RIR: 0.5}
  background_min_snr_db: -5
  background_max_snr_db: 15
  background_dirs:               # under the data root; besides AudioSet and FMA music
    - datasets/demand
    - datasets/musan/musan/noise
    - xiao_pai/extra/video-bg    # 97 of the owner's video clips (every 8th): 4.8% of the 2,009 files picked from

extra_negatives:                 # under the data root
  - {name: alimeeting, dir: xiao_pai_02/extra/alimeeting, weight: 10}
  - {name: demand, dir: xiao_pai_02/extra/demand, weight: 3}
  - {name: musan_noise, dir: xiao_pai_02/extra/musan_noise, weight: 3}
  - {name: video, dir: xiao_pai/extra/video-neg, weight: 8}   # the other 683: no clip on both sides
  - {name: room, dir: xiao_pai/extra/me-pi-room, weight: 8}               # the owner's room on the Pi's mic

training:
  steps: 10000
  negative_class_weight: 20
  near_miss_weight: 8.0
