# Training "Hey Pi" (train.py): what changes between runs lives here, in git.
word: hey pie                    # what Piper says (phonetic spellings work better: "Hey Pi")
wake_word: Hey Pi                # the manifest's name
model_name: hey_pi
piper_samples: 2000
probability_cutoff: 0.95         # tuned on the Pi (higher: fewer false wakes, more misses)

# what it trains on: folders under the data root (train.py reads only datasets/processed/train/ and NN/)
positives:
  - {dir: datasets/processed/train/heypi-me-pi, copies: 5}   # the owner's 171 on the Pi's mic, ×5: the real voice and microphone
  - {dir: datasets/processed/train/heypi-tts}        # speech-service's 9 voices (270)
  - {dir: datasets/processed/train/heypi-tts-female} # a second run of the female voices (240)
near_misses:
  - {dir: datasets/processed/train/heypi-tts-near}        # hey, pie, happy, bye, 嗨, 拜拜 … (810)
  - {dir: datasets/processed/train/heypi-tts-female-near} # (720)

augmentation:                    # the notebook's
  probabilities: {SevenBandParametricEQ: 0.1, TanhDistortion: 0.1, PitchShift: 0.1, BandStopFilter: 0.1,
                  AddColorNoise: 0.1, AddBackgroundNoise: 0.75, Gain: 1.0, RIR: 0.5}
  background_min_snr_db: -5
  background_max_snr_db: 10

training:
  steps: 10000
  negative_class_weight: 20      # the notebook's; higher: fewer false wakes ("Hey Pi" is short)
  near_miss_weight: 5.0          # near_misses below
