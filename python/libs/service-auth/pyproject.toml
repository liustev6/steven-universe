[project]
name = "service-auth"
version = "0.1.0"
description = "Get and check auth-service tokens (see docs/specs/auth-service.md)"
requires-python = ">=3.11"
dependencies = [
    "pyjwt[crypto]>=2.10.1",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.115.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["service_auth*"]
