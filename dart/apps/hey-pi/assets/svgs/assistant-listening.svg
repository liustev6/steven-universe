<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" fill="none" role="img" aria-labelledby="listening-title listening-desc">
  <title id="listening-title">Voice assistant — listening</title>
  <desc id="listening-desc">An outline character with a curved ear, a double-curve smile, and solid moving hands responds to simulated incoming voice. Set --outline-color to change every stroke together.</desc>
  <style>
    .va-listen-head{transform-origin:180px 180px;animation:va-attend 2.4s ease-in-out infinite}
    .va-listen-hand{transform-origin:303px 181px;animation:va-cup 2.4s ease-in-out infinite}
    .va-listen-free{transform-origin:58px 213px;animation:va-respond 2.4s ease-in-out infinite}
    .va-listen-wave{animation:va-incoming 2.4s ease-in-out infinite}
    .va-listen-wave.second{animation-delay:.16s}
    @keyframes va-attend{0%,100%{transform:rotate(0deg)}30%{transform:rotate(3deg)}52%{transform:rotate(1deg)}70%{transform:rotate(2.5deg)}}
    @keyframes va-cup{0%,100%{transform:translate(0,0) rotate(0deg)}30%{transform:translate(-2px,-4px) rotate(-5deg)}60%{transform:translate(-1px,-2px) rotate(-2deg)}}
    @keyframes va-respond{0%,100%{transform:translateY(0) rotate(-8deg)}30%{transform:translateY(-7px) rotate(5deg)}52%{transform:translateY(-2px) rotate(-4deg)}70%{transform:translateY(-5px) rotate(2deg)}}
    @keyframes va-incoming{0%,85%,100%{opacity:.12}24%,60%{opacity:.85}42%{opacity:.3}}
    @media(prefers-reduced-motion:reduce){.va-listen-head,.va-listen-hand,.va-listen-free,.va-listen-wave{animation:none}.va-listen-wave{opacity:.5}}
  </style>
  <g class="va-listen-head">
    <g fill="none" stroke="var(--outline-color, currentColor)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
      <path d="m139 77-19-31m81 31 19-31"/>
      <path d="M271 124q0-47-47-47H116q-47 0-47 47v80q0 47 47 47h108q47 0 47-47v-17"/>
    </g>
    <g stroke="var(--outline-color, currentColor)" stroke-linecap="round" stroke-linejoin="round">
      <path d="M111 150q15-15 30 0 M201 150q15-15 30 0" stroke-width="14"/>
      <path d="M149 181c4 23 20 23 29 5 9 18 25 18 29-5" stroke-width="12"/>
      <path d="M271 124c12-7 24-4 28 6 5 11 1 23-8 30-7 6-6 13-9 19-2 5-6 8-11 8" stroke-width="14"/>
    </g>
  </g>
  <g class="va-listen-hand" stroke="var(--outline-color, currentColor)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M319 158c5 25-3 43-23 48" stroke-width="14"/>
    <path d="m307 188-1-13" stroke-width="10"/>
  </g>
  <g class="va-listen-free" fill="none" stroke="var(--outline-color, currentColor)" stroke-width="9">
    <rect stroke="none" fill="var(--outline-color, currentColor)" x="39" y="195" width="20" height="37" rx="10" transform="rotate(-18 49 213)"/>
  </g>
  <g stroke="var(--outline-color, currentColor)" stroke-width="7.5" stroke-linecap="round">
    <path class="va-listen-wave" d="M315 117q8 7 9 17"/>
    <path class="va-listen-wave second" d="M326 105q13 11 16 27"/>
  </g>
</svg>
