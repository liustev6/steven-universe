# auth-service policy: which clients may get which permissions at which audiences.
# Reviewed in git; no secrets. Lives in infra/ (deployer spec D12); every auth-service deploy
# validates it, shows the diff and installs it as /etc/auth-service/policy.yaml.
# Validate locally: cd python/services/auth-service &&
#   .venv/bin/python -m app.admin --config-dir /tmp check-policy --file ../../../infra/services/auth-service/policy.yaml
# Spec: docs/specs/auth-service.md ("Policy").
#
# Starting small: api-service, file-management, pi-server, the deployer (OpenBao logins), agent-service and
# tools-service (the agents' tools, docs/specs/agent-service/tools.md). Only relaying is enabled:
# no users yet (no `${user}` grants, no `can_assert_users`) and nothing hands out narrow
# tokens yet (no `can_downscope`; see the README before enabling it). Add audiences and clients (gpu-server,
# stevenai-service, ...) as each service adopts service-auth; tests/fixtures/policy.yaml
# shows the full multi-service shape.

issuer: https://auth.lan.liustev6.ca
token_ttl_seconds: 600                   # normal tokens: 10 minutes
downscoped_max_ttl_seconds: 3600         # downscoped (grant 4) tokens: at most 1 hour
max_delegation_depth: 3                  # longest `act` chain allowed (grant 3)

audiences:
  # The public edge: the scopes its routes require from authenticated callers.
  # chat:read and chat:write are /v1/agent/…, relayed to agent-service (grant 3).
  api-service:
    scopes: [files:read, files:write, files:delete, files:list, chat:read, chat:write]

  file-management:
    scopes: [files:read, files:write, files:delete, files:list]
    detail_types:
      file_access:
        actions: [read, write, delete, list]
        location_syntax: prefix          # "<bucket>/<key prefix>"; subset = string prefix
        location_roots: [public/, private/]   # file-management's buckets (its spec, D10); keep in sync

  # Creates and destroys agent sandboxes on VM 200 (docs/specs/agent-service/sandbox-runner.md).
  # Only agent-service may call it.
  sandbox-runner:
    scopes: [sandboxes:claim, sandboxes:release, sandboxes:read, status:read]

  # The agents' control plane on CT 107 (docs/specs/agent-service/control-plane.md).
  # chat:write = start, talk in and end your own sessions; chat:read = read them and their history;
  # chat:admin = everyone's, and the kill switch. Any profile: what a profile may do is its own limits.
  agent-service:
    scopes: [chat:read, chat:write, chat:admin, status:read]

  # Speech out and in, streamed from models kept loaded on pve01's GPU (CT 108; docs/specs/speech-service.md).
  # speech:create = synthesize; speech:transcribe = recognize; status:read = the lab's status page.
  speech-service:
    scopes: [speech:create, speech:transcribe, status:read]

  # The agents' tools: one MCP server (docs/specs/agent-service/tools.md). A client's grant here is the
  # tools it may use; agent-service asks for a session's profile's tools and gets the overlap with its
  # owner's grant (grant_overlap, TL5). Locations: "<namespace>/<tool>", "weather/" = the namespace.
  tools-service:
    scopes: [tools:call]
    grant_overlap: true
    requires_details: true               # every grant names its tools; none named = no tools, never all
    detail_types:
      tool_access:
        actions: [call]
        location_syntax: prefix

  # OpenBao: services log in with a token for this audience. What a login may read is OpenBao's
  # policy (generated from the manifests, infra/secrets-manager/tofu/), not a scope here.
  secrets-manager:
    scopes: [secrets:read]

clients:
  # Deploys services (docs/specs/deployer.md); logs in to OpenBao as role "deployer"
  # (sub=service:deployer). Secret host-only on CT 105.
  deployer:
    grants:
      secrets-manager:
        scopes: [secrets:read]

  # The control plane: claims pods, keeps its login in OpenBao. Secret host-only on CT 107.
  # Relays a session's owner to tools-service (grant 3, the turn's token), and nowhere else.
  agent-service:
    can_relay_clients: true
    relay_audiences: [tools-service]
    grants:
      sandbox-runner:
        scopes: [sandboxes:claim, sandboxes:release, sandboxes:read]
      secrets-manager:                   # OpenBao role "agent-service": only its ChatGPT login (C11)
        scopes: [secrets:read]

  # The `agent` CLI on CT 107, your operator tool: your sessions, and the kill switch.
  # Secret host-only on CT 107, root-only.
  agent-cli:
    grants:
      agent-service:
        scopes: [chat:read, chat:write, chat:admin]

  # speech-service's test client on your Mac (python/services/speech-service/test-client): talk to
  # the live service and hear it, and read its status; and its voice loop (speech → agent → speech),
  # which talks to the agent (profile pi) as its own sessions. Secret in ~/.config/speech-test-client/secret.
  speech-test-client:
    grants:
      speech-service:
        scopes: [speech:create, speech:transcribe, status:read]
      agent-service:
        scopes: [chat:read, chat:write]

  # can_relay_clients: may pass an outside machine client's own identity downstream (grant 3).
  # Relayed to agent-service, a caller gets ITS OWN agent-service grants, never these.
  api-service:
    can_relay_clients: true
    relay_audiences: [agent-service]     # its only relayed route today: /v1/agent/…
    grants:
      sandbox-runner:                    # its public /v1/status reads the runner's pods (S.1)
        scopes: [status:read]
      agent-service:                     # the status page reads agent-service too (S rule)
        scopes: [status:read]
      speech-service:                    # ... and speech-service (S rule)
        scopes: [status:read]
      file-management:
        scopes: [files:read, files:list]
        authorization_details:
          # what anonymous visitors may do, and nothing more
          - {type: file_access, actions: [read, list], locations: ["public/"]}

  # Hey Pi's backend (BFF); the Flutter UI only talks to it. It runs the voice turn
  # (docs/specs/voice-path.md V1): speech in and out, the agent (profile pi) in between.
  pi-server:
    grants:
      speech-service:
        scopes: [speech:create, speech:transcribe]
      agent-service:
        scopes: [chat:read, chat:write]
      tools-service:                     # what Hey Pi's agent may use (its agent sessions get all of this unless a profile's mcp_tools narrows it)
        scopes: [tools:call]
        authorization_details:
          - {type: tool_access, actions: [call], locations: ["weather/", "pi/"]}   # pi/: Hey Pi's own (end_conversation)
      file-management:
        scopes: [files:read, files:write, files:delete, files:list]
        authorization_details:
          # its own folder; its agent's workspaces are sub-folders (private/pi-server/workspaces/...)
          - {type: file_access, actions: [read, write, delete, list], locations: ["private/${client}/"]}

  # Synthetic client for deploy checks (scripts/smoke_test.py); secret only on the auth host,
  # root-only. Its own folder, its own chats (directly, and through api-service's relay), and speech.
  smoke-test:
    grants:
      speech-service:                    # its deploy's smoke test: a sentence spoken, a clip heard
        scopes: [speech:create, speech:transcribe]
      tools-service:                     # its deploy's smoke test: one tool, so the filter shows
        scopes: [tools:call]
        authorization_details:
          - {type: tool_access, actions: [call], locations: ["weather/forecast"]}
      api-service:
        scopes: [chat:read, chat:write]
      agent-service:
        scopes: [chat:read, chat:write]
      file-management:
        scopes: [files:read, files:write, files:delete, files:list]
        authorization_details:
          - {type: file_access, actions: [read, write, delete, list], locations: ["private/${client}/"]}
