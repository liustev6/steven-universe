# auth-service policy: which clients may get which permissions at which audiences.
# Reviewed in git; no secrets. Lives in infra/ (deployer spec D12); every auth-service deploy
# validates it, shows the diff and installs it as /etc/auth-service/policy.yaml.
# Validate locally: cd python/services/auth-service &&
#   .venv/bin/python -m app.admin --config-dir /tmp check-policy --file ../../../infra/services/auth-service/policy.yaml
# Spec: docs/specs/auth-service.md ("Policy").
#
# Starting small: api-service, file-management, pi-server, and the deployer (OpenBao logins). Only relaying is enabled:
# no users yet (no `${user}` grants, no `can_assert_users`) and nothing hands out narrow
# tokens yet (no `can_downscope`; see the README before enabling it). Add audiences and clients (gpu-server,
# stevenai-service, ...) as each service adopts service-auth; tests/fixtures/policy.yaml
# shows the full multi-service shape.

issuer: https://auth.lan.liustev6.ca
token_ttl_seconds: 600                   # normal tokens: 10 minutes
downscoped_max_ttl_seconds: 3600         # downscoped (grant 4) tokens: at most 1 hour
max_delegation_depth: 3                  # longest `act` chain allowed (grant 3)

audiences:
  api-service:                           # the public edge; scopes its routes require from authenticated callers
    scopes: [files:read, files:write, files:delete, files:list]
  file-management:
    scopes: [files:read, files:write, files:delete, files:list]
    detail_types:
      file_access:
        actions: [read, write, delete, list]
        location_syntax: prefix          # "<bucket>/<key prefix>"; subset = string prefix
        location_roots: [public/, private/]   # file-management's buckets (its spec, D10); keep in sync

  sandbox-runner:                        # creates and destroys agent sandboxes on VM 200
                                         # (docs/specs/agent-service/sandbox-runner.md). Only agent-service may call it.
    scopes: [sandboxes:claim, sandboxes:release, sandboxes:read]

  secrets-manager:                       # OpenBao: services log in with a token for this audience.
                                         # What a login may read is OpenBao's policy (generated from the
                                         # manifests, infra/secrets-manager/tofu/), not a scope here.
    scopes: [secrets:read]

clients:
  deployer:                              # deploys services (docs/specs/deployer.md); logs in to OpenBao
                                         # as role "deployer" (sub=service:deployer). Secret host-only on CT 105.
    grants:
      secrets-manager:
        scopes: [secrets:read]

  agent-dev:                             # TEMPORARY (agent-service CP2): the dev gateway on VM 200, standing in for
                                         # agent-service until it exists (CP3), then removed. Secret host-only on VM 200,
                                         # in the dev stack's secrets/ (gitignored).
    grants:
      sandbox-runner:
        scopes: [sandboxes:claim, sandboxes:release, sandboxes:read]

  api-service:
    can_relay_clients: true              # may pass an outside machine client's own identity downstream (grant 3)
    grants:
      file-management:
        scopes: [files:read, files:list]
        authorization_details:
          # what anonymous visitors may do, and nothing more
          - {type: file_access, actions: [read, list], locations: ["public/"]}

  pi-server:                             # Hey Pi's backend (BFF); the Flutter UI only talks to
    grants:
      api-service:
        scopes: [files:read, files:write, files:delete, files:list]
      file-management:
        scopes: [files:read, files:write, files:delete, files:list]
        authorization_details:
          # its own folder; its agent's workspaces are sub-folders (private/pi-server/workspaces/...)
          - {type: file_access, actions: [read, write, delete, list], locations: ["private/${client}/"]}

  smoke-test:                            # synthetic client for deploy checks (scripts/smoke_test.py);
                                         # secret only on the auth host, root-only. Its own folder, nothing else.
    grants:
      file-management:
        scopes: [files:read, files:write, files:delete, files:list]
        authorization_details:
          - {type: file_access, actions: [read, write, delete, list], locations: ["private/${client}/"]}
