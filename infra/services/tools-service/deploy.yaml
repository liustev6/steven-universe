# yaml-language-server: $schema=../deploy.schema.json
# tools-service: the agents' tools, a REST API (443) and MCP (8443) over one registry (CT 109).
# Read by OpenTofu (infra/secrets-manager/tofu/services.tf) and by the deploy (infra/deployment/).
# Spec: docs/specs/agent-service/tools.md.
service: tools-service
host: tools-host
pipeline: false                        # by hand until the deployer knows the host (lxc-setup.md step 13)
wave: 1
code: python/services/tools-service
libs: [service-auth]                   # in the image (its Dockerfile copies it; CI checks)
compose: python/services/tools-service/compose.yaml
config: infra/services/tools-service/config.env        # -> /etc/tools-service/config.env
url: https://tools.lan.liustev6.ca
health: https://tools.lan.liustev6.ca/health
smoke_test:
  script: python/services/tools-service/scripts/smoke_test.py
  secret: /root/.secrets/smoke-test-client   # delivered from kv/shared/smoke_test_client_secret
certificate:
  name: tools.lan.liustev6.ca
  hook: python/services/tools-service/scripts/cert-hook.sh   # -> /usr/local/sbin/tools-service-cert-hook

# Managed secrets: values in OpenBao at kv/<from>, written to <to> (mode 600) on every deploy.
# tools-service has no identity of its own yet (it calls no LAN service): only the deploy's needs.
secrets:
  - from: shared/smoke_test_client_secret
    to: /root/.secrets/smoke-test-client
    owner: "0:0"
  - from: shared/cloudflare_dns_token
    to: /root/.secrets/cloudflare.ini
    owner: "0:0"
    format: "dns_cloudflare_api_token = {value}\n"   # certbot's credentials file
