# agent-service's profiles: what an agent is for (docs/specs/agent-service/control-plane.md C12).
# Reviewed in git; installed as /etc/agent-service/profiles.yaml by every deploy (the deployer's
# `files`). A caller names the profile when it starts a session; any caller with chat:write may
# start any of them (C2), so each one's cost is bounded by its own limits (C13).
#
# Per profile:
#   template             the runner's template: which pod (infra/services/sandbox-runner/templates.yaml)
#   model, effort        null model = Codex's default for your plan
#   instructions         the profile's own rules (optional): first in the agent's instructions
#   allow_caller_instructions   true: a caller may add its own (POST /v1/sessions `instructions`: where
#                        it is, who it serves), after the profile's; false (the default): refused (C15)
#   allow_codex_instructions    true (the default): Codex's own instructions (a coding agent, ~10k
#                        tokens) kept, the profile's added to them; false: the profile's replace them
#   tools                Codex's built-in tools allowed (shell, web_search, view_image); [] = none
#   mcp_tools            tools-service's (tools.md TL5): absent = the session owner's whole grant there;
#                        a list of locations narrows it ("weather/"); [] = none
#   files                file-management (files-and-mounts.md F6): RFC 9396 file_access entries, as in
#                        auth-service's policy (`${client}` = the caller); the session gets their overlap
#                        with its caller's grant. read/list: mounted read-only at /workspace/inputs/<bucket>/…;
#                        write/delete: `publish`. Absent (the default) = no files
#   The session's tools and files are always listed in its instructions, after the profile's own,
#   when it has any: generated from what it was GRANTED (after the intersection with its caller's
#   grant), never from what the profile asks for.
#   limits               wall_seconds (the session), max_turns (per session), max_turn_tokens (per turn)
#   history              carry_turns: the conversation's last N turns, carried into a new session (C9)

profiles:
  # Hey Pi, the panel at home (pi-server, docs/specs/voice-path.md): spoken replies, a fast model.
  # pi-server adds where the panel is, its time zone and the time (caller instructions: Additional Client Info).
  pi:
    template: chat
    model: gpt-6-luna             # the fastest on your plan for short turns (2026-11-17: first word 1.15 s
                                  # median, 90% under 2.3 s; Codex's default gpt-6.1-sol: 4.26 s)
    effort: low                   # luna's lowest (its default is medium)
    instructions: |
      You are Pi, the voice assistant on a panel in Steven's home.
      Everything you write is spoken aloud: one to three short sentences of plain speech, with no
      lists, markdown, links, emoji, or code.
      Reply in **the language you are spoken to**: **English**, **Chinese**, or a mix of the two if
      asked. You speak only these two: spoken to in any other language (Spanish, French, Japanese,
      ...), reply in **English**.
      **When one of your tools (listed below) fits, use it, never a web search** (the weather: a
      place by name, the panel's city unless asked about another). For anything else current or
      that you aren't sure of (news, scores, prices, opening hours), search the web.
      **When the user wants you to stop or is done** (goodbye, "that's all", "stop", "好了，谢谢", "停",
      "休息一下吧", "别说了"),
      call `mcp__tools__pi_end_conversation`, then say one short goodbye: nothing before the call.
      **Before any other tool call, first send a message of its own**: one brief,
      natural line in the reply's language, in your own words and different each time, as a person
      says while looking something up (like "Sure, let me check." or "稍等，让我查一下。"). It is
      spoken while you search, so it must come first, never after the results. Then answer in
      natural speech, without sources or links.
      Each user message starts with `[now: …]`, the panel's local time, for your reference; never
      include it in your response. Use the "Additional Client Info" below only for place and
      time questions. **Never name the city or time zone** unless asked where you are.
    allow_caller_instructions: true
    allow_codex_instructions: false     # fewer tokens per call (agent-runtime.md Q3)
    tools: [web_search]           # runs at OpenAI: the sandbox still reaches only the gateway (G4)
    limits: {wall_seconds: 1800, max_turns: 60, max_turn_tokens: 50000}
    history: {carry_turns: 4}

  # Steven AI: answers about steven-universe from its specs (CP6; CP8 adds search over them). Reads the
  # public bucket, read-only (the specs: public/steven-universe/specs/, synced from docs/specs by the
  # deployer); writes nothing. A shell to read them with (in the sandbox: gVisor and the gateway are
  # the boundary).
  steven-ai:
    template: chat
    model: null                   # Codex's default for your plan
    effort: medium
    instructions: |
      You are Steven AI: you answer questions about steven-universe, Steven's home lab (its services,
      their designs, decisions and status), from its specs.
      The specs are Markdown files under /workspace/inputs/public/steven-universe/specs/ (read-only).
      Before answering, find what is relevant with your shell (ls, grep -rn, cat), and say which spec
      and section you used (e.g. "deployer.md, D21"). If the specs don't cover it, say so: don't guess.
    allow_codex_instructions: false
    tools: [shell]
    mcp_tools: []                 # no tools-service tools
    files:
      - {actions: [read, list], locations: ["public/"]}
    limits: {wall_seconds: 1800, max_turns: 40, max_turn_tokens: 200000}
    history: {carry_turns: 6}

  # Deploy smoke tests: one short turn, as cheap as possible.
  smoke:
    template: chat
    effort: low
    instructions: Reply with exactly the word the user asks for, and nothing else.
    allow_codex_instructions: false
    mcp_tools: []                 # no tools: smoke-test is granted some for tools-service's own smoke test
    limits: {wall_seconds: 120, max_turns: 2, max_turn_tokens: 20000}
    history: {carry_turns: 0}
