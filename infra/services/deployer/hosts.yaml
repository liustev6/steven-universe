# The deployer's host allowlist (docs/specs/deployer.md D6): the only hosts it may deploy to, each
# with its address and pinned SSH host key (public; read through pve01 and checked over the network
# before pinning: `pct exec <id> -- cat /etc/ssh/ssh_host_ed25519_key.pub`).
#
# Installed as /etc/deployer/hosts.yaml ONLY by a hand deploy of the deployer
# (infra/deployment/deploy.sh deployer, which shows the diff). A change merged to main does nothing
# until then: the pipeline can never widen its own reach. The deployer reads the installed copy,
# never this file at a deployed commit.
#
# Never listed (D13; the deploy refuses them): auth-host (CT 102), bao-host (CT 104), deployer-host.
hosts:
  files-host:                          # CT 103: runs file-management
    address: 192.168.50.66
    user: root
    host_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFTFg1f4ffXCIyyiXpO51jqJuj5NeBQdFBNMKReN5H1a"
  api-host:                            # CT 106: runs api-service (wave 2)
    address: 192.168.50.192
    user: root
    host_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEnsM741IazUQodGBPtciM6M7VEfIZswQGlGPcucyJDp"
  sandbox-host:                        # VM 200: runs sandbox-runner (agent sandboxes). A VM: its key is read
                                       # through pve01 with `qm guest exec 200 -- cat …` (the guest agent)
    address: 192.168.50.95
    user: root
    host_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHa5J52kJ2dAui4xl8BkUGCxNWgkvAjkPafUkIkSm/um"
