# deploy: deploy a wave of services through api-service -> deployer (one job per service, in
# parallel). Called by build.yml, once per wave; never run on its own.
# Spec: docs/specs/deployer.md (D2-D5, D17, D19, "GitHub side").
#
# GitHub's OIDC token minted here carries job_workflow_ref = .../deploy.yml@refs/heads/main: the
# deployer accepts deploy requests only from this file, as on main (DEPLOYER_GITHUB_WORKFLOW_REF).
name: deploy

on:
  workflow_call:
    inputs:
      services:
        description: 'JSON list of {"service": ..., "image_sha": ...} (from plan.sh)'
        type: string
        required: true

permissions: {}

jobs:
  deploy:
    name: deploy ${{ matrix.service }}
    runs-on: ubuntu-24.04
    environment: production           # main only; the deployer requires it in the token (D17)
    permissions: {contents: read, id-token: write}
    concurrency: {group: "deploy-${{ matrix.service }}", cancel-in-progress: false}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.services) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {sparse-checkout: .github/scripts, persist-credentials: false}
      - name: Deploy (api-service -> deployer -> host)
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE_SHA: ${{ matrix.image_sha }}
        run: bash .github/scripts/deploy.sh
