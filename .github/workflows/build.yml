# build: test and build every service image whose inputs changed, and push it to GHCR.
# Spec: docs/specs/deployer.md (D1, D1a, phase 1). Deploying is separate: infra/deployment/deploy.sh
# today, the deployer in phase 2.
#
# An image is named by the commit that last changed its inputs (D1a): the manifest's `code` folder
# plus python/libs/. For each infra/services/*/deploy.yaml, `plan` computes that commit and builds
# only if ghcr.io/liustev6/steven-universe/<service>:<that sha> doesn't exist yet. A config-only
# commit builds nothing, and re-running is always safe.
#
# Build an older commit's missing images (e.g. to roll back to a commit from before this workflow):
#   gh workflow run build.yml -f ref=<sha>
name: build

on:
  push:
    branches: [main]
    paths: ["python/**", "infra/services/**", ".github/workflows/build.yml"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit or branch whose missing images to build"
        default: main

permissions: {}                       # each job asks only for what it needs

env:
  REGISTRY: ghcr.io/liustev6/steven-universe

jobs:
  plan:
    runs-on: ubuntu-24.04
    permissions: {contents: read, packages: read}
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0              # full history: the image sha comes from git log
          persist-credentials: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: plan
        name: Which images are missing
        run: |
          set -euo pipefail
          entries='[]'
          for m in infra/services/*/deploy.yaml; do
            svc="$(yq -r '.service' "$m")"
            code="$(yq -r '.code // ""' "$m")"
            compose="$(yq -r '.compose' "$m")"
            [ -n "$code" ] || { echo "::error file=$m::no 'code' folder (needed for the image sha, D1a)"; exit 1; }
            image_sha="$(git log -1 --format=%H HEAD -- "$code" python/libs)"
            [ -n "$image_sha" ] || { echo "::error file=$m::no commit touches $code"; exit 1; }

            # Build settings come from the service's compose file (one place for them, D12).
            q() { yq -r "explode(.) | .services[\"$svc\"] | $1" "$compose"; }
            want="$REGISTRY/$svc:\${IMAGE_TAG:-local}"
            [ "$(q .image)" = "$want" ] || { echo "::error file=$compose::image must be $want"; exit 1; }
            context="$(realpath -m --relative-to=. "$(dirname "$compose")/$(q .build.context)")"
            dockerfile="$context/$(q .build.dockerfile)"

            if docker manifest inspect "$REGISTRY/$svc:$image_sha" >/dev/null 2>&1; then
              echo "$svc: $REGISTRY/$svc:${image_sha:0:7} exists, skip"
              continue
            fi
            echo "$svc: build ${image_sha:0:7} (last change to $code or python/libs)"
            entries="$(jq -c --arg s "$svc" --arg c "$code" --arg i "$image_sha" \
              --arg x "$context" --arg f "$dockerfile" \
              '. + [{service: $s, code: $c, image_sha: $i, context: $x, dockerfile: $f}]' <<<"$entries")"
          done
          echo "matrix={\"include\":$entries}" >>"$GITHUB_OUTPUT"
          echo "any=$([ "$entries" = '[]' ] && echo false || echo true)" >>"$GITHUB_OUTPUT"

  libs:
    runs-on: ubuntu-24.04
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with: {python-version: "3.11"}
      - name: Test service-auth
        working-directory: python/libs/service-auth
        run: |
          python -m pip install -q ".[fastapi]" pytest
          python -m pytest -q tests

  build:
    needs: [plan, libs]
    if: needs.plan.outputs.any == 'true'
    name: ${{ matrix.service }}
    runs-on: ubuntu-24.04
    permissions: {contents: read, packages: write, id-token: write, attestations: write}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with: {python-version: "3.11"}
      - name: Test
        working-directory: ${{ matrix.code }}
        run: |
          python -m pip install -q -r requirements-dev.txt
          python -m pytest -q

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          build-args: REVISION=${{ matrix.image_sha }}
          tags: ${{ env.REGISTRY }}/${{ matrix.service }}:${{ matrix.image_sha }}
          push: true
          provenance: false           # GitHub's attestation below instead
          sbom: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ matrix.service }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Summary
        run: |
          echo "**${{ matrix.service }}**: \`${{ env.REGISTRY }}/${{ matrix.service }}:${{ matrix.image_sha }}\`" >>"$GITHUB_STEP_SUMMARY"
          echo "digest \`${{ steps.build.outputs.digest }}\`" >>"$GITHUB_STEP_SUMMARY"
