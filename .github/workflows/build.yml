# build: test and build every service image whose inputs changed, push it to GHCR, then deploy the
# changed `pipeline: true` services in waves. Spec: docs/specs/deployer.md (D1, D1a, D16, D17, D19).
#
#   plan ─▶ checks ─▶ build (per missing image) ─▶ wave1 (services) ─▶ wave2 (the edge: api-service)
#
# The logic lives in .github/scripts/ (plan.sh, deploy.sh; tests in .github/scripts/tests/), always
# taken from this workflow's own commit, so building an older ref still uses today's scripts.
#
#   gh workflow run build.yml -f ref=<sha>            build an older commit's missing images
#   gh workflow run build.yml -f redeploy=<service>   redeploy a pipeline service at main's latest
#                                                     commit (GitHub's token is bound to it, D5;
#                                                     roll back with `git revert`, or by hand with
#                                                     infra/deployment/deploy.sh <svc> <sha>)
name: build

on:
  push:
    branches: [main]
    paths: ["python/**", "infra/services/**", "infra/images/**", ".github/**"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit or branch whose missing images to build"
        default: main
      redeploy:
        description: "A pipeline service to redeploy at main's latest commit (ref must be main)"
        default: ""

permissions: {}                       # each job asks only for what it needs

env:
  REGISTRY: ghcr.io/liustev6/steven-universe

jobs:
  plan:
    runs-on: ubuntu-24.04
    permissions: {contents: read, packages: read}
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
      wave1: ${{ steps.plan.outputs.wave1 }}
      wave2: ${{ steps.plan.outputs.wave2 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0              # full history: the image sha comes from git log
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {path: .ci, sparse-checkout: .github/scripts, persist-credentials: false}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: plan
        name: What to build and deploy
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          REDEPLOY: ${{ inputs.redeploy }}
        run: bash .ci/.github/scripts/plan.sh

  checks:
    runs-on: ubuntu-24.04
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {path: .ci, sparse-checkout: .github/scripts, persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with: {python-version: "3.11"}
      - name: Test service-auth
        working-directory: python/libs/service-auth
        run: |
          python -m pip install -q ".[fastapi]" pytest
          python -m pytest -q tests
      - name: Test the CI scripts
        run: bash .ci/.github/scripts/tests/run.sh

  build:
    needs: [plan, checks]
    if: needs.plan.outputs.any == 'true'
    name: build ${{ matrix.service }}
    runs-on: ubuntu-24.04
    permissions: {contents: read, packages: write, id-token: write, attestations: write}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with: {python-version: "3.11"}
      - name: Test
        working-directory: ${{ matrix.code }}
        run: |
          python -m pip install -q -r requirements-dev.txt
          python -m pytest -q
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          build-args: REVISION=${{ matrix.image_sha }}
          tags: ${{ env.REGISTRY }}/${{ matrix.service }}:${{ matrix.image_sha }}
          push: true
          provenance: false           # GitHub's attestation below instead
          sbom: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ matrix.service }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Summary
        run: |
          echo "**${{ matrix.service }}**: \`${{ env.REGISTRY }}/${{ matrix.service }}:${{ matrix.image_sha }}\`" >>"$GITHUB_STEP_SUMMARY"
          echo "digest \`${{ steps.build.outputs.digest }}\`" >>"$GITHUB_STEP_SUMMARY"

  # ---- Deploy in waves (D19): wave 2 runs only if wave 1 succeeded (or had nothing to do) ----------
  wave1:
    needs: [plan, checks, build]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && needs.plan.outputs.wave1 != '[]'
      && needs.checks.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    permissions: {contents: read, id-token: write}
    uses: ./.github/workflows/deploy.yml
    with: {services: "${{ needs.plan.outputs.wave1 }}"}

  wave2:
    needs: [plan, checks, build, wave1]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && needs.plan.outputs.wave2 != '[]'
      && needs.checks.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped')
      && (needs.wave1.result == 'success' || needs.wave1.result == 'skipped')
    permissions: {contents: read, id-token: write}
    uses: ./.github/workflows/deploy.yml
    with: {services: "${{ needs.plan.outputs.wave2 }}"}
